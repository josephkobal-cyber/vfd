<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;font-weight:400;src:url(assets/manrope-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:500;src:url(assets/manrope-latin-500-normal.woff2)}
@font-face{font-family:Manrope;font-weight:600;src:url(assets/manrope-latin-600-normal.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(assets/manrope-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:424px;overflow:hidden;background:#06100c;font-family:Manrope,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(120% 90% at 70% -10%,#0f4a33 0%,#082418 38%,#050a08 75%)}
#glow{position:absolute;width:520px;height:360px;left:300px;top:-140px;border-radius:50%;
  background:#15b87a;opacity:.35;filter:blur(90px)}
#grid{position:absolute;inset:0;opacity:.18;
  background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(80% 70% at 50% 40%,#000 0%,transparent 80%)}
#cam{position:absolute;left:0;top:0;width:720px;height:424px;transform-origin:0 0}
#panel{position:absolute;left:110px;top:34px;width:500px;height:356px;border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 40%,rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(21,184,122,.12);overflow:hidden}
#head{position:absolute;left:22px;right:22px;top:18px;display:flex;align-items:center;gap:10px}
.orb{width:30px;height:30px;border-radius:50%;background:url(assets/orb.png) center/cover;box-shadow:0 0 14px rgba(26,229,149,.45)}
#head .name{font-size:14px;font-weight:600}
#head .st{font-size:11px;opacity:.55;display:flex;align-items:center;gap:5px;margin-top:2px}
#head .dot{width:6px;height:6px;border-radius:50%;background:#1ae595}
#head .x{margin-left:auto;display:flex;gap:6px}
#head .x i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
#thread{position:absolute;left:22px;right:22px;top:66px;bottom:84px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden}
.msg{max-width:78%;font-size:15px;line-height:1.45;padding:11px 15px;border-radius:18px;overflow:hidden;transform-origin:bottom}
.ai{align-self:flex-start;background:rgba(255,255,255,.08);border-top-left-radius:6px}
.me{align-self:flex-end;background:#15b87a;color:#04140d;font-weight:600;border-top-right-radius:6px}
#typing{display:flex;gap:5px;padding:14px 16px}
#typing b{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.5}
#input{position:absolute;left:18px;right:18px;bottom:18px;height:54px;border-radius:30px;display:flex;align-items:center;
  padding:0 6px 0 20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
#field{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;display:flex;align-items:center}
#ph{opacity:.42}
#caret{display:inline-block;width:2px;height:20px;background:#1ae595;margin-left:1px}
#send{width:42px;height:42px;border-radius:50%;background:#15b87a;display:flex;align-items:center;justify-content:center}
#mic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin-right:6px}
#ptr{position:absolute;left:0;top:0;width:22px;height:22px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
#ring{position:absolute;width:42px;height:42px;border-radius:50%;border:2px solid #1ae595}
#fade{position:absolute;inset:0;background:#050a08;pointer-events:none}
</style></head>
<body>
<div id="stage">
  <div id="glow"></div><div id="grid"></div>
  <div id="cam">
    <div id="panel">
      <div id="head"><div class="orb"></div><div><div class="name">AI Assistant</div><div class="st"><span class="dot"></span>Online · replies in seconds</div></div><div class="x"><i></i><i></i></div></div>
      <div id="thread">
        <div class="msg ai" id="m0">Hello, how can I help you?</div>
        <div class="msg me" id="m1">Do you work with Microsoft Teams?</div>
        <div class="msg ai" id="m2"><span id="m2t"></span><span id="typing"><b></b><b></b><b></b></span></div>
      </div>
      <div id="input">
        <div id="field"><span id="ph">Type your question…</span><span id="typed"></span><span id="caret"></span></div>
        <div id="mic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></div>
        <div id="send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></div>
      </div>
      <div id="ring"></div>
    </div>
    <svg id="ptr" viewBox="0 0 24 24"><path d="M4 2l15 9.5-6.6 1.4L16.5 21l-3 1.4-4.1-8.1L4 18.6z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>
  <div id="fade"></div>
</div>
<script>
const LENGTH = 5.0; window.LENGTH = LENGTH;
const Q = 'Do you work with Microsoft Teams?';
const A = 'Yes! Virtual Front Desk works natively with Microsoft Teams, so visitors can reach your team right from the lobby.';
const $ = id => document.getElementById(id);
const cl = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p = (t,a,b)=>cl((t-a)/(b-a));
const io = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;      // ease in-out cubic
const out = x=>1-Math.pow(1-x,3);
const lerp=(a,b,k)=>a+(b-a)*k;
// panel-local geometry
const PX=110, PY=34, inputCY = PY+356-18-27, sendCX = PX+500-18-6-21, sendCY = inputCY;
function render(t){
  // ---- camera: wide -> zoom on input (typing) -> ease back to thread (answer)
  const k1 = io(p(t,0.0,2.2)), k2 = io(p(t,2.5,3.5));
  let s = lerp(1.08,1.42,k1), fx = lerp(360,330,k1), fy = lerp(220,inputCY-6,k1);
  s = lerp(s,1.3,k2); fx = lerp(fx,360,k2); fy = lerp(fy,262,k2);
  s *= 1 + 0.02*p(t,3.5,4.7);                            // slow drift at the end
  const tx = 360 - fx*s, ty = 212 - fy*s;
  $('cam').style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  // ---- typing 0.45 -> 2.05
  const n = Math.round(Q.length * p(t,0.45,2.05));
  const sent = t >= 2.42;
  $('typed').textContent = sent ? '' : Q.slice(0,n);
  $('ph').style.display = (n>0 && !sent) ? 'none' : '';
  $('ph').style.opacity = sent ? .42*p(t,2.6,2.9) : .42;
  $('caret').style.opacity = (sent || Math.floor(t*2.6)%2===0 || (n>0&&n<Q.length)) ? (sent?0:1) : 0;
  // ---- pointer glides to send, clicks at 2.35
  const pk = io(p(t,1.75,2.3));
  const px = lerp(PX+430, sendCX-4, pk), py = lerp(PY+420, sendCY-2, pk);
  $('ptr').style.transform = `translate(${px}px,${py}px) scale(${t>2.3&&t<2.45?0.85:1})`;
  $('ptr').style.opacity = p(t,1.6,1.8) * (1-p(t,2.7,2.95));
  const press = t>2.3&&t<2.45 ? 0.9 : 1;
  $('send').style.transform = `scale(${press})`;
  const rk = p(t,2.35,2.85);
  $('ring').style.left = (500-18-6-21-21)+'px'; $('ring').style.top=(356-18-27-21)+'px';
  $('ring').style.transform = `scale(${1+rk*0.9})`; $('ring').style.opacity = rk>0 ? (1-rk)*0.9 : 0;
  // ---- messages
  const m1k = out(p(t,2.42,2.8));
  const m1 = $('m1'); m1.style.display = t>=2.42?'':'none';
  m1.style.opacity = m1k; m1.style.transform = `translateY(${(1-m1k)*24}px) scale(${0.92+0.08*m1k})`;
  const m2 = $('m2'); m2.style.display = t>=2.85?'':'none';
  const m2k = out(p(t,2.85,3.1)); m2.style.opacity = m2k; m2.style.transform = `translateY(${(1-m2k)*16}px)`;
  const streaming = t>=3.3;
  $('typing').style.display = streaming?'none':'flex';
  m2.style.padding = streaming ? '' : '0';
  [...$('typing').children].forEach((b,i)=>{ b.style.opacity = .3+.6*Math.max(0,Math.sin((t*9)-i*0.9)); });
  const words = A.split(' '); const wn = Math.round(words.length*p(t,3.3,4.35));
  $('m2t').textContent = streaming ? words.slice(0,wn).join(' ') : '';
  // ---- loop fade
  $('fade').style.opacity = Math.max(1-p(t,0,0.25), p(t,4.7,5.0));
}
window.render = render;
const q = new URLSearchParams(location.search); render(parseFloat(q.get('t')||'0'));
</script>
</body></html>
